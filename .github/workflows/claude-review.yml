name: Claude Auto Review and Comment
on:
  pull_request:
      types: [opened, synchronize]
        issue_comment:
            types: [created, edited]
              pull_request_review_comment:
                  types: [created, edited]

                  jobs:
                    review:
                        runs-on: ubuntu-latest
                            permissions:
                                  contents: read
                                        pull-requests: write
                                              issues: write
                                                    id-token: write

                                                            # Only run if it's a new PR or if @claude is mentioned in a comment
                                                                if: |
                                                                      (github.event_name == 'pull_request') ||
                                                                            (contains(github.event.comment.body, '@claude')) ||
                                                                                  (contains(github.event.review_comment.body, '@claude'))

                                                                                          steps:
                                                                                                - uses: actions/checkout@v6
                                                                                                        with:
                                                                                                                  fetch-depth: 1
                                                                                                                        
                                                                                                                              - uses: anthropics/claude-code-action@v1
                                                                                                                                      with:
                                                                                                                                                anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                                                                                                                                                          prompt: |
                                                                                                                                                                      You are Claude, a helpful AI assistant bot in this GitHub repository.
                                                                                                                                                                                  
                                                                                                                                                                                              CONTEXT:
                                                                                                                                                                                                          - Repository: ${{ github.repository }}
                                                                                                                                                                                                                      - Event Type: ${{ github.event_name }}
                                                                                                                                                                                                                                  - Triggered by: ${{ github.event.sender.login }}
                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                          {% if github.event_name == 'pull_request' %}
                                                                                                                                                                                                                                                                      - PR Number: ${{ github.event.pull_request.number }}
                                                                                                                                                                                                                                                                                  - PR Title: ${{ github.event.pull_request.title }}
                                                                                                                                                                                                                                                                                              - Action: ${{ github.event.action }}
                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                      Please review this pull request with a focus on:
                                                                                                                                                                                                                                                                                                                                  - Code quality and best practices
                                                                                                                                                                                                                                                                                                                                              - Potential bugs or issues
                                                                                                                                                                                                                                                                                                                                                          - Security implications
                                                                                                                                                                                                                                                                                                                                                                      - Performance considerations
                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                              The PR branch is already checked out in the current working directory.
                                                                                                                                                                                                                                                                                                                                                                                                          Use `gh pr comment` for top-level feedback.
                                                                                                                                                                                                                                                                                                                                                                                                                      Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
                                                                                                                                                                                                                                                                                                                                                                                                                                  Only post GitHub comments - don't submit review text as messages.
                                                                                                                                                                                                                                                                                                                                                                                                                                              {% else %}
                                                                                                                                                                                                                                                                                                                                                                                                                                                          - Comment Author: ${{ github.event.comment.author_association }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - Comment Body: ${{ github.event.comment.body }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              A user mentioned you (@claude) in a comment. Please:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          1. Read and understand their request in the comment
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      2. Analyze any referenced code or issue
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  3. Provide a helpful technical response
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              4. Post your response as a comment using `gh` commands
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      If they ask for code review, bug analysis, architecture suggestions, or improvements, provide detailed technical feedback with examples.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  Use `gh issue comment` or `gh pr comment` to respond, depending on the context.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              {% endif %}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        claude_args: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue comment:*),Bash(gh issue view:*)"
