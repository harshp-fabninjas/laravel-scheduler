name: Claude AI Code Review

on:
  pull_request:
      types: [opened, synchronize, reopened]
        issue_comment:
            types: [created, edited]

            jobs:
              claude-review:
                  runs-on: ubuntu-latest
                      if: github.event_name == 'pull_request' || contains(github.event.comment.body, '@claude')

                          permissions:
                                pull-requests: write
                                      contents: read
                                            issues: write

                                                steps:
                                                      - name: Checkout code
                                                              uses: actions/checkout@v4
                                                                      with:
                                                                                fetch-depth: 0

                                                                                      - name: Get PR details from comment mention
                                                                                              id: comment_pr
                                                                                                      if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
                                                                                                              run: |
                                                                                                                        echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
                                                                                                                                  echo "comment_id=${{ github.event.comment.id }}" >> $GITHUB_OUTPUT
                                                                                                                                            echo "comment_body=${{ github.event.comment.body }}" >> $GITHUB_OUTPUT
                                                                                                                                                      echo "comment_author=${{ github.event.comment.user.login }}" >> $GITHUB_OUTPUT
                                                                                                                                                      
                                                                                                                                                            - name: Get PR details from PR event
                                                                                                                                                                    id: pr_details
                                                                                                                                                                            if: github.event_name == 'pull_request'
                                                                                                                                                                                    run: |
                                                                                                                                                                                              echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
                                                                                                                                                                                                        echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                  echo "pr_body=${{ github.event.pull_request.body }}" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                  
                                                                                                                                                                                                                        - name: Trigger Claude Review
                                                                                                                                                                                                                                id: claude
                                                                                                                                                                                                                                        env:
                                                                                                                                                                                                                                                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                                                                                                                                                            PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
                                                                                                                                                                                                                                                                      REPO_OWNER: ${{ github.repository_owner }}
                                                                                                                                                                                                                                                                                REPO_NAME: ${{ github.event.repository.name }}
                                                                                                                                                                                                                                                                                          COMMENT_BODY: ${{ github.event.comment.body }}
                                                                                                                                                                                                                                                                                                    IS_COMMENT: ${{ github.event_name == 'issue_comment' }}
                                                                                                                                                                                                                                                                                                              COMMENT_ID: ${{ github.event.comment.id }}
                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                # Workflow triggered for Claude review
                                                                                                                                                                                                                                                                                                                                          echo "Claude review initiated for PR #$PR_NUMBER"
                                                                                                                                                                                                                                                                                                                                                    echo "Event type: ${{ github.event_name }}"
                                                                                                                                                                                                                                                                                                                                                              if [ "$IS_COMMENT" = "true" ]; then
                                                                                                                                                                                                                                                                                                                                                                          echo "Claude mentioned in comment #$COMMENT_ID"
                                                                                                                                                                                                                                                                                                                                                                                      echo "Comment body: $COMMENT_BODY"
                                                                                                                                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                      - name: Post response comment
                                                                                                                                                                                                                                                                                                                                                                                                              id: post_comment
                                                                                                                                                                                                                                                                                                                                                                                                                      uses: actions/github-script@v7
                                                                                                                                                                                                                                                                                                                                                                                                                              if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
                                                                                                                                                                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                script: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                            github.rest.issues.createComment({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          issue_number: context.issue.number,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        owner: context.repo.owner,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      repo: context.repo.repo,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    body: '🤖 **Claude AI Review**\n\n⏳ Processing your request...\n\n**Note:** Full Claude review will be posted once the GitHub App processes the request. Please ensure your Claude GitHub App is properly configured with your API credentials.'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Post initial status for PR
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              uses: actions/github-script@v7
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if: github.event_name == 'pull_request'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        script: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    github.rest.issues.createComment({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  issue_number: context.issue.number,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                owner: context.repo.owner,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              repo: context.repo.repo,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            body: '⏳ **Claude AI Review Starting**\n\nClause AI will analyze this PR and provide feedback...'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        })
