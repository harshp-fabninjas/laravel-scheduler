name: Claude PR Review - Simple

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.comment.body, '@claude') && 
      github.event.issue.pull_request != null

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print debug info
        run: |
          echo "Comment: ${{ github.event.comment.body }}"
          echo "Issue Number: ${{ github.event.issue.number }}"

      - name: Prepare Claude prompt
        id: prompt
        run: |
          # Extract the actual user message (remove @claude mention)
          USER_MESSAGE="${{ github.event.comment.body }}"
          USER_MESSAGE="${USER_MESSAGE//@claude/}"
          USER_MESSAGE=$(echo "$USER_MESSAGE" | xargs)
          
          echo "cleaned_message=$USER_MESSAGE" >> $GITHUB_OUTPUT
          echo "Cleaned message: $USER_MESSAGE"

      - name: Get PR Details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            core.setOutput('title', pr.data.title);
            core.setOutput('body', pr.data.body || '');
            core.setOutput('author', pr.data.user.login);
            core.setOutput('additions', pr.data.additions);
            core.setOutput('deletions', pr.data.deletions);

      - name: Call Claude API
        id: claude
        run: |
          # Build the prompt
          PROMPT="You are a code review assistant on GitHub. A user is asking you about a pull request.

User's Request: ${{ steps.prompt.outputs.cleaned_message }}

PR Title: ${{ steps.pr.outputs.title }}
PR Author: ${{ steps.pr.outputs.author }}
PR Stats: +${{ steps.pr.outputs.additions }} / -${{ steps.pr.outputs.deletions }}
PR Description: ${{ steps.pr.outputs.body }}

Please respond to their request with helpful, specific feedback about the PR."

          # Escape the prompt for JSON
          PROMPT_ESCAPED=$(echo "$PROMPT" | jq -Rs .)

          # Make API call
          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "{
              \"model\": \"claude-opus-4-20250805\",
              \"max_tokens\": 2048,
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": $PROMPT_ESCAPED
                }
              ]
            }")

          echo "API Response: $RESPONSE"

          # Extract the review text
          REVIEW=$(echo "$RESPONSE" | jq -r '.content[0].text // empty')
          
          if [ -z "$REVIEW" ]; then
            echo "ERROR: No review text found in response"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          # Save to output
          echo "review<<REVIEW_EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "REVIEW_EOF" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.claude.outputs.review }}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🤖 Claude Bot Response\n\n${review}`
            });

      - name: Post Error (if failed)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Claude review failed. Make sure:\n1. \`ANTHROPIC_API_KEY\` is set in Settings → Secrets\n2. API key is valid\n3. Check workflow logs for details`
            });
