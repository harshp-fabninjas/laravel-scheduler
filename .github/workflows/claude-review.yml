name: Claude PR Review Bot

on:
  issue_comment:
    types: [created, edited]

jobs:
  review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Get PR details and diff
        id: pr_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}

          # Get PR diff
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/pulls/$PR_NUMBER.diff" \
            > pr.diff

          # Get PR info
          PR_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/pulls/$PR_NUMBER")

          PR_TITLE=$(echo "$PR_INFO" | jq -r '.title')
          PR_BODY=$(echo "$PR_INFO" | jq -r '.body // ""')

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "pr_body=$PR_BODY" >> $GITHUB_OUTPUT

      - name: Review with Claude
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DIFF: ${{ steps.pr_info.outputs.PR_DIFF }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const Anthropic = require('@anthropic-ai/sdk');

          const client = new Anthropic({
            apiKey: process.env.ANTHROPIC_API_KEY
          });

          const prDiff = fs.readFileSync('pr.diff', 'utf-8');
          const prTitle = '${{ steps.pr_info.outputs.PR_TITLE }}';
          const prBody = `${{ steps.pr_info.outputs.pr_body }}`;

          const reviewPrompt = `You are an expert code reviewer. Review this Pull Request and provide constructive feedback.

PR Title: ${prTitle}
PR Description: ${prBody || 'No description provided'}

Diff:
\`\`\`diff
${prDiff}
\`\`\`

Provide a concise but thorough code review covering:
1. Code quality and style
2. Potential issues or bugs
3. Suggestions for improvement
4. Any security concerns

Keep the review concise and actionable.`;

          client.messages.create({
            model: 'claude-3-5-haiku-20241022',
            max_tokens: 1024,
            messages: [
              {
                role: 'user',
                content: reviewPrompt
              }
            ]
          }).then(response => {
            const review = response.content[0].text;
            fs.writeFileSync('review.txt', review);
            console.log('Review generated successfully');
          }).catch(error => {
            console.error('Error:', error);
            process.exit(1);
          });
          EOF

      - name: Post review as comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.txt', 'utf-8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Claude AI Review\n\n${review}\n\n---\n*Review generated by Claude Haiku*`
            });
