name: Claude PR Review - Simple

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.comment.body, '@claude') && 
      github.event.issue.pull_request != null

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print debug info
        run: |
          echo "Comment: ${{ github.event.comment.body }}"
          echo "Issue Number: ${{ github.event.issue.number }}"

      - name: Prepare Claude prompt
        id: prompt
        run: |
          USER_MESSAGE="${{ github.event.comment.body }}"
          USER_MESSAGE="${USER_MESSAGE//@claude/}"
          USER_MESSAGE=$(echo "$USER_MESSAGE" | xargs)
          echo "cleaned_message=$USER_MESSAGE" >> $GITHUB_OUTPUT

      - name: Get PR Details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            core.setOutput('title', pr.data.title);
            core.setOutput('body', pr.data.body || '');
            core.setOutput('author', pr.data.user.login);
            core.setOutput('additions', pr.data.additions);
            core.setOutput('deletions', pr.data.deletions);

      - name: Call Claude API
        id: claude
        env:
          CLEANED_MSG: ${{ steps.prompt.outputs.cleaned_message }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PR_ADDITIONS: ${{ steps.pr.outputs.additions }}
          PR_DELETIONS: ${{ steps.pr.outputs.deletions }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Create request JSON
          REQUEST=$(cat <<'REQEOF'
          {
            "model": "claude-haiku-4-20250122",
            "max_tokens": 2048,
            "messages": [
              {
                "role": "user",
                "content": "You are a code review assistant on GitHub.\n\nUser's Request: USER_MSG_HERE\n\nPR Title: PR_TITLE_HERE\nPR Author: PR_AUTHOR_HERE\nPR Stats: +PR_ADDITIONS_HERE / -PR_DELETIONS_HERE\nPR Description: PR_BODY_HERE\n\nPlease respond to their request with helpful, specific feedback about the PR."
              }
            ]
          }
          REQEOF
          )
          
          # Replace placeholders
          REQUEST="${REQUEST//USER_MSG_HERE/$CLEANED_MSG}"
          REQUEST="${REQUEST//PR_TITLE_HERE/$PR_TITLE}"
          REQUEST="${REQUEST//PR_AUTHOR_HERE/$PR_AUTHOR}"
          REQUEST="${REQUEST//PR_ADDITIONS_HERE/$PR_ADDITIONS}"
          REQUEST="${REQUEST//PR_DELETIONS_HERE/$PR_DELETIONS}"
          REQUEST="${REQUEST//PR_BODY_HERE/$PR_BODY}"
          
          # Make API call
          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "x-api-key: $API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "$REQUEST")
          
          echo "API Response:"
          echo "$RESPONSE" | jq . || echo "$RESPONSE"
          
          # Extract review
          REVIEW=$(echo "$RESPONSE" | jq -r '.content[0].text // empty')
          
          if [ -z "$REVIEW" ]; then
            echo "ERROR: No review found"
            exit 1
          fi
          
          # Save output
          echo "review<<REVIEWEOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "REVIEWEOF" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.claude.outputs.review }}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🤖 Claude Bot Response\n\n${review}`
            });

      - name: Post Error (if failed)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Claude review failed.\n\nMake sure:\n1. ANTHROPIC_API_KEY is set in Settings → Secrets\n2. API key is valid\n3. Check workflow logs for details`
            });
